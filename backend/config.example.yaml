server:
  host: 0.0.0.0
  port: 8000

data:
  path: /data

home_assistant:
  base_url: http://homeassistant.local:8123
  token: YOUR_LONG_LIVED_TOKEN
  refresh_seconds: 15

render:
  default_grid:
    width: 400
    height: 250
  default_legend:
    min_f: 60
    max_f: 80
  sidebar:
    enabled: true
    components:
      - type: timestamp
      - type: outside_temp
      - type: temperature_chart
        width: 260
        height: 160
        history_hours: 12
        forecast_hours: 12
      - type: legend
      - type: thermostat_action_chart
        width: 260
        height: 140
        history_hours: 24
      - type: thermostat_setpoint_chart
        width: 260
        height: 140
        history_hours: 24

timelapse:
  frame_retention_hours: 48
  window_hours: 48
  sampling_seconds: 120
  target_duration_seconds: 60
  fps: 10
  output_path: /data/timelapses
  rolling_enabled: true
  rolling_interval_seconds: 900
  stitch_multi_floor: true
  border_px: 12
  label_font_size: 18
