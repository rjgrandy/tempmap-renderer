<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Floorplan Builder</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #191c24;
        --panel-2: #141722;
        --accent: #4ea1ff;
        --text: #e6e9ef;
        --muted: #9aa3b2;
        --danger: #ff6b6b;
        --grid: rgba(255, 255, 255, 0.05);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        overflow: hidden;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid #262a36;
        gap: 16px;
      }
      .tabs {
        display: flex;
        gap: 8px;
      }
      .tab {
        background: transparent;
        border: 1px solid #30364a;
        color: var(--text);
        padding: 6px 14px;
        border-radius: 6px;
        cursor: pointer;
      }
      .tab.active {
        background: var(--accent);
        color: #0b1020;
        border-color: transparent;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .top-actions select,
      .top-actions button {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid #32384d;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      .top-actions button.primary {
        background: var(--accent);
        color: #0b1020;
        border: none;
      }
      .main {
        flex: 1;
        display: grid;
        grid-template-columns: 80px 1fr 280px;
        overflow: hidden;
      }
      .toolbar {
        background: var(--panel);
        border-right: 1px solid #262a36;
        padding: 10px 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-x: hidden;
        overflow-y: hidden;
      }
      .tool-button {
        background: transparent;
        border: 1px solid #30364a;
        color: var(--text);
        padding: 8px;
        border-radius: 6px;
        font-size: 11px;
        cursor: pointer;
        text-align: center;
      }
      .tool-button.active {
        background: var(--accent);
        color: #0b1020;
        border-color: transparent;
      }
      .toolbar label {
        font-size: 11px;
        color: var(--muted);
        display: flex;
        gap: 6px;
        align-items: center;
        max-width: 100%;
      }
      .toolbar label.toolbar-grid {
        flex-direction: column;
        align-items: flex-start;
      }
      .toolbar label input[type="number"] {
        width: 100%;
        min-width: 0;
      }
      .canvas-wrap {
        position: relative;
        background: #10131c;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .properties {
        background: var(--panel);
        border-left: 1px solid #262a36;
        padding: 12px;
        overflow-y: auto;
      }
      .properties h3 {
        margin-top: 0;
        font-size: 14px;
        color: var(--text);
      }
      .properties .field {
        margin-bottom: 10px;
      }
      .properties label {
        font-size: 12px;
        color: var(--muted);
        display: block;
        margin-bottom: 4px;
      }
      .properties input,
      .properties select,
      .properties textarea {
        width: 100%;
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid #32384d;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
      }
      .properties button {
        width: 100%;
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid #32384d;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
        cursor: pointer;
      }
      .properties button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .statusbar {
        padding: 6px 12px;
        background: var(--panel);
        border-top: 1px solid #262a36;
        font-size: 12px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .danger {
        color: var(--danger);
      }
      .toast {
        position: fixed;
        right: 16px;
        top: 16px;
        background: var(--panel);
        border: 1px solid #32384d;
        color: var(--text);
        padding: 10px 14px;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        opacity: 0;
        transform: translateY(-8px);
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 50;
        max-width: 280px;
      }
      .toast.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .toast.error {
        border-color: rgba(255, 107, 107, 0.6);
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="tabs">
          <button class="tab" data-floor="floor1">First Story</button>
          <button class="tab" data-floor="floor2">Second Story</button>
        </div>
        <div class="top-actions">
          <label for="loadSelect">Load</label>
          <select id="loadSelect"></select>
          <button id="loadBtn">Load</button>
          <button id="assignStoryBtn">Set Story</button>
          <button id="newBtn">New</button>
          <button id="deleteBtn">Delete</button>
          
          <input type="file" id="bgUpload" accept="image/*" style="display: none;" />
          <button id="bgUploadBtn">Upload BG</button>
          <button id="bgRemoveBtn">Remove BG</button>
          <button id="saveBtn" class="primary">Save</button>
          <button id="undoBtn">Undo</button>
          <button id="redoBtn">Redo</button>
        </div>
      </header>
      <div class="main">
        <aside class="toolbar">
          <button class="tool-button" data-tool="select">Select</button>
          <button class="tool-button" data-tool="wall">Wall</button>
          <button class="tool-button" data-tool="door">Door</button>
          <button class="tool-button" data-tool="sensor">Sensor</button>
          <button class="tool-button" data-tool="thermostat">Thermostat</button>
          <button class="tool-button" data-tool="room_label">Room Label</button>
          <button class="tool-button" data-tool="stairwell">Stairwell</button>
          <button class="tool-button" data-tool="scale">Scale</button>
          <button class="tool-button" data-tool="erase">Erase</button>
          <hr />
          <label><input type="checkbox" id="snapToggle" checked /> Snap</label>
          <label><input type="checkbox" id="orthoToggle" checked /> Ortho</label>
          <label class="toolbar-grid">
            Grid
            <input type="number" id="gridSizeInput" min="5" max="200" step="5" />
          </label>
        </aside>
        <section class="canvas-wrap">
          <canvas id="canvas"></canvas>
        </section>
        <aside class="properties">
          <div id="properties"></div>
        </aside>
      </div>
      <footer class="statusbar">
        <div class="status-pill" id="statusText">Ready</div>
        <div class="status-pill" id="statusMeta"></div>
        <div class="status-pill" id="coordReadout"></div>
        <div class="status-pill">Space + Drag to Pan • Mouse Wheel to Zoom</div>
      </footer>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
